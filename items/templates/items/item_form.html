{% extends "items/base.html" %}
{% block title %}{% if object %}编辑物品{% else %}发布新物品{% endif %}{% endblock %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">{% if object %}编辑物品{% else %}发布新物品{% endif %}</h2>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data" id="itemForm">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% if object %}{% url 'item-detail' object.pk %}{% else %}{% url 'user-item-list' %}{% endif %}" class="btn btn-secondary">取消</a>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
// 监听物品类型变化，重新提交表单以加载动态属性
function setupCategoryListener() {
    const categorySelect = document.getElementById('id_category');
    if (!categorySelect) return;
    
    categorySelect.addEventListener('change', function() {
        // 创建隐藏输入字段，标识这是类别变更请求
        const form = document.getElementById('itemForm');
        
        // 移除旧的action字段（如果存在）
        const oldAction = form.querySelector('input[name="action"]');
        if (oldAction) {
            oldAction.remove();
        }
        
        // 添加新的action字段
        const actionInput = document.createElement('input');
        actionInput.type = 'hidden';
        actionInput.name = 'action';
        actionInput.value = 'load_attributes';
        form.appendChild(actionInput);
        
        // 提交表单
        form.submit();
    });
}

// 页面加载完成后设置监听器
document.addEventListener('DOMContentLoaded', setupCategoryListener);
</script>
{% endblock %}
